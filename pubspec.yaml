
name: sitara_live
description: Sitara Live — live streaming and gifting app
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1
  agora_rtc_engine: ^6.3.2
  http: ^1.2.1
  shared_preferences: ^2.2.3
  permission_handler: ^11.3.1

  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.0.1
  firebase_storage: ^12.3.2

  image_picker: ^1.1.2
  share_plus: ^10.1.2
  url_launcher: ^6.3.0
  qr_flutter: ^4.1.0
  gal: ^2.3.0
  mobile_scanner: ^5.2.3
  file_picker: ^8.1.2
  app_links: ^6.3.2

  country_code_picker: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.png
